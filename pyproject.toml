[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-plate-damage"
version = "1.1.0"
description = "Physics-informed damage identification for Kirchhoff-Love plates"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.0,<3",
  "numpy>=1.23,<3",
  "scipy>=1.10,<2",
  "matplotlib>=3.7,<4",
  "pandas>=1.5,<3",
]

[project.optional-dependencies]
test = ["pytest>=7,<9", "ruff>=0.6,<1"]

[project.scripts]
pinn-plate-damage = "src.main:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
